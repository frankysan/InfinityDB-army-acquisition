[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-army-acquisition"
version = "0.1.0"
description = "Standalone Infinity Army JSON snapshot acquisition"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
infinity-army-snapshot = "infinity_army_acquisition.cli:main"
infinity-army-history-inventory = "infinity_army_acquisition.history_inventory:main"

[tool.setuptools.packages.find]
where = ["src"]
